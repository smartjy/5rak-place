<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>랭킹 · 오락실</title>
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body class="page-narrow">
  <header class="shell">
    <div class="top">
      <a class="brand" href="./" aria-label="오락실 처음 화면">
        <img class="brand-mark" src="assets/mark.svg" alt="">
        <span class="brand-name">오락실</span>
      </a>
      <a class="top-link" href="./">게임 고르기</a>
    </div>
  </header>

  <main class="shell">
    <h1 class="page-title" id="title">전체 1등 판</h1>
    <p class="page-sub" id="sub">게임마다 1등을 모았어요.</p>

    <div class="tabs" role="tablist" aria-label="기간" id="tabs">
      <button class="tab" role="tab" type="button" id="tab-week" data-period="week" aria-controls="panel">주간</button>
      <button class="tab" role="tab" type="button" id="tab-month" data-period="month" aria-controls="panel">월간</button>
      <button class="tab" role="tab" type="button" id="tab-all" data-period="all" aria-controls="panel">올타임</button>
    </div>
    <div id="panel" role="tabpanel" tabindex="0">
      <p class="period" id="period"></p>
      <div id="board"></div>
    </div>

    <div class="actions" id="actions"></div>
    <section class="manage" id="manage" hidden></section>
  </main>

  <footer class="shell foot">
    <p><strong>기록은 이 기기에만 저장돼요.</strong> 폰마다 기록이 따로 쌓여요. 주간은 월요일 0시, 월간은 1일 0시(한국 시간)에 새로 시작해요.</p>
  </footer>

  <script src="lib/5rak.js"></script>
  <script src="assets/rank.js"></script>
</body>
</html>
